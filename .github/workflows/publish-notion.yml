name: Publish Notion page as PR

on:
  workflow_dispatch:
    inputs:
      notion_url:
        description: "Notion page URL or page ID (share page with Notion integration)"
        required: true
        type: string
      slug:
        description: "Optional unique post slug (leave blank to derive from title)"
        required: false
        type: string
      post_date:
        description: "Optional YYYY-MM-DD (leave blank for Notion creation date)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: notion-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-notion.txt
      - name: Export Notion post and images
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_URL: ${{ inputs.notion_url }}
          POST_DATE: ${{ inputs.post_date }}
          POST_SLUG: ${{ inputs.slug }}
        run: |
          python scripts/notion_to_blog.py --url "$NOTION_URL" ${POST_DATE:+--date "$POST_DATE"} ${POST_SLUG:+--slug "$POST_SLUG"}
      - name: Validate newly generated post and images
        run: |
          set -euo pipefail
          POST="$(git ls-files --others --exclude-standard _posts | head -n 1)"
          test -n "$POST"
          python scripts/validate_post_images.py --post "$POST"
      - name: Build Jekyll preview before publication
        run: |
          gem install bundler
          bundle install
          bundle exec jekyll build
      - name: Publish validated post and images to master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts assets/images/posts
          git commit -m "docs(master): publish validated Notion post"
          git push origin HEAD:master
